version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni-portal-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    volumes:
      - .:/var/www/html
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
    networks:
      - omni-network

  nginx:
    image: nginx:alpine
    container_name: omni-portal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - omni-network

  redis:
    image: redis:7-alpine
    container_name: omni-portal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - omni-network

networks:
  omni-network:
    driver: bridge